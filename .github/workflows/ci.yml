name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    # Any base branch, not only main. Stacked pull requests target the branch
    # beneath them, and a filter of [main] would leave every one of them
    # ungated.
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Verify module and static analysis
        run: |
          go mod verify
          go vet ./...

      - name: Test with race detector and coverage
        run: go test -race -shuffle=on -count=1 -coverpkg=./... -covermode=atomic -coverprofile=coverage.out ./...

      - name: Build all commands
        run: go build -trimpath ./...

      - name: Validate GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  web:
    name: Website quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix website ci --ignore-scripts

      - name: Verify formatting
        run: npm run format:check

      - name: Test and build
        run: |
          npm test
          npm run build

      - name: Audit dependencies
        run: npm run audit

  policy:
    name: OPA policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test policy bundle
        run: >-
          docker run --rm
          --volume "$PWD/deploy/opa/policy:/policy:ro"
          openpolicyagent/opa:0.70.0@sha256:2b1c4b231f6dfa6a2baea4af4109203b10cd4b65e836d72f03bfe5d8dfce7095
          test /policy

  containers:
    name: Container builds
    needs: [go, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build control API image
        run: docker build --file deploy/docker/control-api.Dockerfile --tag haechi/control-api:ci .

      - name: Build website image
        run: docker build --file website/Dockerfile --tag haechi/website:ci website
