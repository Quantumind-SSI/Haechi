name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    # Any base branch, not only main. Stacked pull requests target the branch
    # beneath them, and a filter of [main] would leave every one of them
    # ungated.
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Exercises the PostgreSQL control-plane store: tenant isolation and
      # transactional enrolment cannot be proven against the memory store.
      postgres:
        image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
        env:
          POSTGRES_USER: haechi
          POSTGRES_PASSWORD: haechi
          POSTGRES_DB: haechi_control
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U haechi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Exercises the gateway replay store. This is a separate database with a
      # separate role, not a second schema in the one above, because a gateway
      # must never hold credentials to identity-linked control-plane state
      # (deploy/postgres/replay-schema.sql, ADR-004). Running them apart keeps
      # the tests honest about a boundary the product depends on.
      postgres-replay:
        image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
        env:
          POSTGRES_USER: haechi_gateway
          POSTGRES_PASSWORD: haechi_gateway
          POSTGRES_DB: haechi_replay
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U haechi_gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HAECHI_CONTROL_TEST_DATABASE_URL: postgresql://haechi:haechi@127.0.0.1:5433/haechi_control
      HAECHI_REPLAY_TEST_DATABASE_URL: postgresql://haechi_gateway:haechi_gateway@127.0.0.1:5434/haechi_replay
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Verify module and static analysis
        run: |
          go mod verify
          go vet ./...

      - name: Test with race detector and coverage
        run: go test -race -shuffle=on -count=1 -coverpkg=./... -covermode=atomic -coverprofile=coverage.out ./...

      - name: Build all commands
        run: go build -trimpath ./...

      - name: Validate GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  web:
    name: Website quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # Exercises the real PostgreSQL storage adapter, including the
      # concurrent rate-limit test that a stub cannot prove.
      postgres:
        image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
        env:
          POSTGRES_USER: haechi
          POSTGRES_PASSWORD: haechi
          POSTGRES_DB: haechi_pilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haechi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HAECHI_DATABASE_URL: postgresql://haechi:haechi@127.0.0.1:5432/haechi_pilot
      HAECHI_TEST_DATABASE_URL: postgresql://haechi:haechi@127.0.0.1:5432/haechi_pilot
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix website ci --ignore-scripts

      - name: Verify formatting
        run: npm run format:check

      - name: Apply database migrations
        run: npm --prefix website run migrate

      - name: Test and build
        run: |
          npm test
          npm run build

      - name: Build the Cloudflare Pages output
        env:
          HAECHI_API_BASE: https://api.haechi.example
        run: |
          set -euo pipefail
          npm --prefix website run pages:build
          # The deployed site is unusable if the API origin is missing from
          # either the browser config or the content security policy.
          grep -q "$HAECHI_API_BASE" website/public/config.js
          grep -q "connect-src 'self' $HAECHI_API_BASE" website/public/_headers

      - name: Audit dependencies
        run: npm run audit

  policy:
    name: OPA policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test policy bundle
        run: >-
          docker run --rm
          --volume "$PWD/deploy/opa/policy:/policy:ro"
          openpolicyagent/opa:0.70.0@sha256:2b1c4b231f6dfa6a2baea4af4109203b10cd4b65e836d72f03bfe5d8dfce7095
          test /policy

  containers:
    name: Container builds
    needs: [go, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build control API image
        run: docker build --file deploy/docker/control-api.Dockerfile --tag haechi/control-api:ci .

      - name: Build website image
        run: docker build --file website/Dockerfile --tag haechi/website:ci website
