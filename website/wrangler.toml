# Cloudflare Pages configuration for the Haechi website.
#
# Cloudflare serves static assets only. The pilot API and its data live in
# Azure Container Apps; see deploy/azure and dev-docs/operations/deployment.md.
#
# Build output is produced by `npm run pages:build` into ./public, which also
# generates config.js and _headers from HAECHI_API_BASE. There are no Pages
# Functions and no D1 binding: this project stores nothing at the edge.

name = "haechi-website"
pages_build_output_dir = "public"
compatibility_date = "2024-11-06"
