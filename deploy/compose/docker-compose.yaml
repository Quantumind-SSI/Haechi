# Haechi local development dependencies. The control API currently uses its
# in-memory store; PostgreSQL is included for adapter and schema testing.
#
#   docker compose -f deploy/compose/docker-compose.yaml up
#
name: haechi

services:
  # --- Upstream: PostgreSQL (control-plane state) ---------------------------
  postgres:
    image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: haechi
      POSTGRES_PASSWORD: haechi
      POSTGRES_DB: haechi
    volumes:
      - ../postgres/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haechi"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Upstream: Open Policy Agent (authorisation) --------------------------
  opa:
    image: openpolicyagent/opa:0.70.0@sha256:2b1c4b231f6dfa6a2baea4af4109203b10cd4b65e836d72f03bfe5d8dfce7095
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policy"]
    volumes:
      - ../opa/policy:/policy:ro
    ports: ["127.0.0.1:8181:8181"]

  # --- Upstream: Keycloak (identity federation, OIDC) -----------------------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6@sha256:82c5b7a110456dbd42b86ea572e728878549954cc8bd03cd65410d75328095d2
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["127.0.0.1:8083:8080"]

  # --- Upstream: OpenBao (secrets / Transit signing) ------------------------
  openbao:
    image: quay.io/openbao/openbao:2.0.1@sha256:4fe96e91e531ef2694916fb2a92d7f7efd4a172059378bf83e0eafd8160b4396
    cap_add: ["IPC_LOCK"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: dev-root
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["127.0.0.1:8200:8200"]

  # --- Upstream: NATS (control events) --------------------------------------
  nats:
    image: nats:2.10.20@sha256:97f3bde5637e9cb75c09c15869c79c2c0d909f26c8dd371d169b175a58ff771a
    command: ["-js"]
    ports: ["127.0.0.1:4222:4222"]

  # --- Haechi: control-api composition root ---------------------------------
  control-api:
    build:
      context: ../..
      dockerfile: deploy/docker/control-api.Dockerfile
    environment:
      HAECHI_ENV: "development"
      HAECHI_LISTEN: ":8080"
      HAECHI_DEV_ADMIN_TOKEN: "${HAECHI_DEV_ADMIN_TOKEN:?set HAECHI_DEV_ADMIN_TOKEN to at least 32 characters}"
      OPA_URL: "http://opa:8181"           # authz -> real OPA adapter
      # Enable OpenBao Transit signing (after `bao secrets enable transit`
      # and creating an ed25519 key named haechi-control):
      # OPENBAO_ADDR: "http://openbao:8200"
      # OPENBAO_TOKEN: "dev-root"
      # OPENBAO_KEY: "haechi-control"
    depends_on: [opa]
    ports: ["127.0.0.1:8080:8080"]
